<style>
  :root{
    --bg:          #0a0f1a;
    --bg-2:        #0e1524;
    --panel:       #111a2b;
    --panel-2:     #0f1726;
    --border:      #1e2b44;
    --border-soft: #182338;
    --text:        #e8eef7;
    --text-dim:    #8697b4;
    --text-faint:  #5c6c88;
    --accent:      #5eead4;   /* teal */
    --accent-2:    #7dd3fc;   /* sky */
    --green:       #10b981;
    --red:         #ef4444;

    --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-body:    'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono:    'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(94,234,212,.06), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(125,211,252,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:56px 28px 72px; }

  /* ---------- Header ---------- */
  .eyebrow{
    display:flex; align-items:center; gap:9px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--accent); margin:0 0 14px;
  }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 12px 1px var(--accent); }
  h1{
    font-family:var(--font-display); font-weight:700; letter-spacing:-.02em;
    font-size:clamp(34px, 5.4vw, 60px); line-height:1.02; margin:0 0 18px;
  }
  h1 .fade{ background:linear-gradient(90deg,#a7f3d0,#7dd3fc);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lede{ color:var(--text-dim); font-size:clamp(15px,1.6vw,17px); max-width:560px;
    line-height:1.55; margin:0; }

  /* ---------- Controls ---------- */
  .controls{
    margin:34px 0 22px; padding:18px;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--border); border-radius:16px;
    display:flex; flex-direction:column; gap:16px;
  }
  .controls-grid{
    display:grid; grid-template-columns:1fr 1fr 220px; gap:16px;
  }
  .field label{
    display:flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--text-faint); margin-bottom:9px;
  }
  .field label svg{ opacity:.8; }
  .control{
    width:100%; background:var(--bg-2); color:var(--text);
    border:1px solid var(--border); border-radius:11px;
    padding:13px 14px; font-family:var(--font-body); font-size:15px;
    appearance:none; outline:none; color-scheme:dark;
    transition:border-color .18s, box-shadow .18s;
  }
  .control:hover{ border-color:#2a3c5e; }
  .control:focus{ border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(94,234,212,.14); }
  .control optgroup{ color:var(--text-dim); font-style:normal;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; }
  .control optgroup option{ color:var(--text); font-family:var(--font-body);
    font-size:14px; letter-spacing:normal; }
  .select-wrap{ position:relative; }
  .select-wrap .chev{ position:absolute; right:14px; top:50%; transform:translateY(-50%);
    pointer-events:none; color:var(--text-dim); }
  select.control{ padding-right:38px; cursor:pointer; }
  input.control::-webkit-outer-spin-button,
  input.control::-webkit-inner-spin-button{ opacity:.5; }

  /* ---------- Public charging row ---------- */
  .charging-row{
    display:flex; align-items:center; flex-wrap:wrap; gap:14px 26px;
    padding-top:16px; border-top:1px solid var(--border-soft);
  }
  .switch{ display:inline-flex; align-items:center; gap:11px; cursor:pointer;
    user-select:none; }
  .switch input{ position:absolute; opacity:0; width:0; height:0; }
  .switch .track{ width:42px; height:24px; border-radius:99px; background:var(--bg-2);
    border:1px solid var(--border); position:relative; transition:background .2s, border-color .2s; }
  .switch .thumb{ position:absolute; left:3px; top:2px; width:18px; height:18px;
    border-radius:50%; background:var(--text-dim); transition:transform .2s, background .2s; }
  .switch input:checked + .track{ background:rgba(94,234,212,.22); border-color:var(--accent); }
  .switch input:checked + .track .thumb{ transform:translateX(18px); background:var(--accent);
    box-shadow:0 0 10px rgba(94,234,212,.6); }
  .switch input:focus-visible + .track{ box-shadow:0 0 0 3px rgba(94,234,212,.18); }
  .switch-label{ display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--text-dim); }
  .switch input:checked ~ .switch-label{ color:var(--text); }

  .pub-controls{ display:flex; align-items:center; gap:14px 30px; flex-wrap:wrap;
    transition:opacity .2s; }
  .pub-controls.off{ opacity:.38; pointer-events:none; }
  .pub-group{ display:flex; align-items:center; gap:11px; }
  .pub-cap{ font-size:13px; color:var(--text-dim); white-space:nowrap; }
  .pub-val{ font-family:var(--font-mono); font-size:15px; color:var(--accent);
    min-width:44px; }
  .pub-note{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
    letter-spacing:.04em; white-space:nowrap; }
  .rate-input{ display:inline-flex; align-items:center; gap:2px; background:var(--bg-2);
    border:1px solid var(--border); border-radius:9px; padding:7px 11px;
    transition:border-color .18s, box-shadow .18s; }
  .rate-input:focus-within{ border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(94,234,212,.14); }
  .rate-input .sym{ color:var(--text-dim); font-family:var(--font-mono); font-size:14px; }
  .rate-input .unit{ color:var(--text-faint); font-family:var(--font-mono); font-size:12px; }
  .rate-input input{ width:52px; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--font-mono); font-size:14px; }
  .rate-input input::-webkit-outer-spin-button,
  .rate-input input::-webkit-inner-spin-button{ opacity:.4; }
  .slider{ -webkit-appearance:none; appearance:none; width:150px; height:5px;

  .slider::-moz-range-thumb{ width:16px; height:16px; border-radius:50%;
    background:var(--accent); border:2px solid #0a0f1a; cursor:pointer; }

  /* ---------- Map ---------- */
  .map-card{

    border:1px solid var(--border); border-radius:18px;
    padding:16px 16px 14px; overflow:hidden;

  .map-card::before{ content:""; position:absolute; inset:0;

    pointer-events:none; }
  svg.usmap{ width:100%; height:auto; display:block; }
  svg.usmap path.state{
    stroke:#0a0f1a; stroke-width:.75;
    transition:fill .55s cubic-bezier(.4,0,.2,1), filter .18s, opacity .18s;
    cursor:pointer;
  }
  svg.usmap path.state:hover{ filter:brightness(1.18) saturate(1.1); }
  svg.usmap.dim path.state:not(.hl){ opacity:.42; }
  svg.usmap path.state.hl{ stroke:var(--accent); stroke-width:1.4; }

  .map-status{ display:flex; align-items:center; justify-content:center;
    height:360px; color:var(--text-dim); font-size:15px; gap:10px; }
  .map-status .spin{ width:16px; height:16px; border:2px solid var(--border);

  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Legend ---------- */
  .legend{ display:flex; align-items:center; gap:14px; padding:4px 8px 6px; }
  .legend .cap{ font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--text-faint); white-space:nowrap; }
  .legend .cap.more{ color:var(--accent); }
  .legend .bar{ flex:1; height:8px; border-radius:6px;
    background:linear-gradient(90deg,#dc2626,#f87171,#64748b,#6ee7b7,#059669); }

  /* ---------- Tooltip ---------- */
  .tooltip{
    position:absolute; z-index:20; pointer-events:none;
    min-width:230px; background:rgba(12,18,30,.97);
    border:1px solid var(--border); border-radius:13px;
    padding:13px 14px; backdrop-filter:blur(8px);
    box-shadow:0 18px 40px -12px rgba(0,0,0,.7);
    opacity:0; transform:translateY(6px); transition:opacity .15s, transform .15s;
  }
  .tooltip.show{ opacity:1; transform:translateY(0); }
  .tt-name{ font-family:var(--font-display); font-weight:600; font-size:16px;
    margin-bottom:2px; }
  .tt-sav{ font-family:var(--font-mono); font-size:20px; font-weight:700; margin-bottom:10px; }
  .tt-sav.pos{ color:#34d399; } .tt-sav.neg{ color:#f87171; }
  .tt-sav small{ font-family:var(--font-body); font-weight:500; font-size:11px;
    color:var(--text-dim); letter-spacing:.04em; display:block; margin-top:1px; }
  .tt-row{ display:flex; justify-content:space-between; gap:16px;
    font-size:12.5px; padding:3px 0; color:var(--text-dim); }
  .tt-row span:last-child{ color:var(--text); font-family:var(--font-mono); }
  .tt-split{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--border-soft); }
  .tt-chip{ background:var(--bg-2); border:1px solid var(--border-soft);
    border-radius:9px; padding:8px 10px; }
  .tt-chip .lab{ font-size:10px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--text-faint); margin-bottom:3px; }
  .tt-chip .val{ font-family:var(--font-mono); font-size:15px; }
  .tt-chip.gas .val{ color:#fca5a5; } .tt-chip.ev .val{ color:#5eead4; }

  /* ---------- Summary cards ---------- */
  .cards{ margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card{ position:relative; background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border); border-radius:16px; padding:20px 22px;
    overflow:hidden; }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--accent),transparent); }
  .card .clab{ display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-faint); margin-bottom:12px; }
  .card .big{ font-family:var(--font-mono); font-weight:700; letter-spacing:-.01em;
    font-size:38px; line-height:1; color:#34d399; }
  .card .big .slash{ color:var(--text-faint); font-size:22px; font-weight:400; }
  .card .sub{ color:var(--text-dim); font-size:13px; margin-top:9px; }

  /* ---------- Footnote ---------- */
  .foot{ display:flex; gap:9px; margin-top:26px; color:var(--text-faint);
    font-size:12.5px; line-height:1.5; max-width:900px; }
  .foot svg{ flex-shrink:0; margin-top:2px; color:var(--accent); }
  .data-badge{ flex-shrink:0; align-self:flex-start; font-family:var(--font-mono);
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim);
    background:var(--bg-2); border:1px solid var(--border); border-radius:99px;
    padding:3px 9px; white-space:nowrap; }
  .data-badge.live{ color:var(--accent); border-color:rgba(94,234,212,.4);
    background:rgba(94,234,212,.08); }

  @media (max-width:820px){
    .controls-grid{ grid-template-columns:1fr; }
    .cards{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

// us-atlas labels states by full name; this lets us match features -> our data.
const STATE_BY_NAME = Object.fromEntries(STATES.map(s => [s.name, s]));

// Public charging price ($/kWh). No clean per-state public feed exists (prices vary by
// network, membership, and time of day), so the user sets this. It defaults to a national
// average, and we surface the typical range next to the input.
// Early-2026 references: DC fast ~$0.53/kWh; typical public range ~$0.43–$0.68/kWh.
const PUBLIC_RATE_DEFAULT = 0.48;
const PUBLIC_RATE_RANGE   = "$0.43–$0.68";

// ---- Live pricing source (dormant until hosted) -----------------------------
// The prototype computes from the hardcoded STATES above. To go live, publish a JSON file
// shaped like  { updated:"2026-07-19", states:[{code,name,gas,elec}, ...] }  and put its
// URL here. A scheduled job (GitHub Actions / Vercel Cron / a Cloudflare Worker) refreshes
// that file from EIA + gas-price sources on whatever cadence you pick. Nothing else changes.
const PRICING_URL = null; // e.g. "https://your-host.com/data/pricing.json"

/* =====================================================================
   CALCULATIONS — implemented exactly to spec (home charging).
   ===================================================================== */
function computeState(state, gasV, evV, miles, publicShare, publicRate){
  // Effective electricity price: publicShare of miles at public rate, rest at residential.
  const effElec   = state.elec * (1 - publicShare) + publicRate * publicShare;
  const gasAnnual = (miles / gasV.mpg) * state.gas;
  const evAnnual  = miles * (evV.kwhPer100mi / 100) * effElec;
  const savings   = gasAnnual - evAnnual;
  const gasPer100 = (100 / gasV.mpg) * state.gas;
  const evPer100  = evV.kwhPer100mi * effElec;
  return { ...state, effElec, publicShare, gasAnnual, evAnnual, savings, gasPer100, evPer100 };
}

/* =====================================================================
   HELPERS
   ===================================================================== */
// Pre-projected (Albers USA) geometry: draws directly into the 975x610 viewBox
// with no runtime projection needed.
const TOPO_CDNS = [
  "https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json",
  "https://unpkg.com/us-atlas@3/states-albers-10m.json",
];

const fmtMoney0 = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtMoney2 = n => "$" + n.toFixed(2);

// group a vehicle list by manufacturer, preserving order, for <optgroup> menus
function groupByMake(list){
  const groups = [], idx = {};
  list.forEach(v => {
    if (!(v.make in idx)){ idx[v.make] = groups.length; groups.push({ make:v.make, items:[] }); }
    groups[idx[v.make]].items.push(v);
  });
  return groups;
}
// short model name (strip the make prefix, since the optgroup already shows it)
const modelName = v => v.name.startsWith(v.make + " ") ? v.name.slice(v.make.length + 1) : v.name;

function lerp(a, b, t){ return a + (b - a) * t; }
function lerpColor(c1, c2, t){
  return `rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`;
}
// diverging: pale->deep green for savings, pale->deep red when EV costs more
function colorFor(v, maxPos, maxNeg){
  if (v >= 0){
    const t = maxPos > 0 ? Math.min(1, v / maxPos) : 0;
    return lerpColor([167,243,208], [4,120,87], Math.pow(t, 0.85));   // #a7f3d0 -> #047857
  } else {
    const t = maxNeg > 0 ? Math.min(1, (-v) / maxNeg) : 0;
    return lerpColor([252,165,165], [153,27,27], Math.pow(t, 0.85));  // #fca5a5 -> #991b1b
  }
}

// tween a number toward its target for the summary cards
function useAnimatedNumber(target, duration = 650){
  const [val, setVal] = useState(target);
  const ref = useRef({ raf:0 });
  useEffect(() => {
    const from = val, start = performance.now();
    cancelAnimationFrame(ref.current.raf);
    const tick = now => {
      const p = Math.min(1, (now - start) / duration);
      const e = 1 - Math.pow(1 - p, 3);
      setVal(from + (target - from) * e);
      if (p < 1) ref.current.raf = requestAnimationFrame(tick);
    };
    ref.current.raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(ref.current.raf);
  }, [target]);
  return val;
}

  road: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>,
  trend:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>,
  pin:  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>,
  flag: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 22V4M5 4l5 2 4-2 5 2v9l-5-2-4 2-5-2"/></svg>,
  plug: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></svg>,
};

/* =====================================================================
   APP
   ===================================================================== */
function App(){
  const [gasId, setGasId]   = useState("camry");
  const [evId, setEvId]     = useState("m3");
  const [miles, setMiles]   = useState(12000);
  const [publicOn, setPublicOn]     = useState(false);
  const [publicPct, setPublicPct]   = useState(30);
  const [publicRate, setPublicRate] = useState(PUBLIC_RATE_DEFAULT);
  const [pricing, setPricing] = useState({ states: STATES, updated: null, live: false });

  const [features, setFeatures] = useState(null);
  const [loadError, setLoadError] = useState(false);
  const [hover, setHover]   = useState(null);   // { code, x, y }
  const wrapRef = useRef(null);

  const gasV = GAS_VEHICLES.find(v => v.id === gasId);
  const evV  = EV_VEHICLES.find(v => v.id === evId);
  const safeMiles = Number.isFinite(miles) && miles > 0 ? miles : 0;

  // load map geometry once (works in preview and once hosted)
  useEffect(() => {
    let alive = true;
    (async () => {
      for (const url of TOPO_CDNS){
        try {
          const topo = await d3.json(url);
          const geo = topojson.feature(topo, topo.objects.states);
          if (alive){ setFeatures(geo.features); }
          return;
        } catch(e){ /* try next cdn */ }
      }
      if (alive) setLoadError(true);
    })();
    return () => { alive = false; };
  }, []);

  // pull live pricing if a source is configured; otherwise stay on sample data
  useEffect(() => {
    if (!PRICING_URL) return;
    let alive = true;
    fetch(PRICING_URL)
      .then(r => r.json())
      .then(d => {
        if (alive && d && Array.isArray(d.states)) {
          setPricing({ states: d.states, updated: d.updated || null, live: true });
        }
      })
      .catch(() => { /* keep sample data on failure */ });
    return () => { alive = false; };
  }, []);

  // recompute every state whenever a control changes
  const publicShare = publicOn ? Math.min(100, Math.max(0, publicPct)) / 100 : 0;
  const effPublicRate = Number.isFinite(publicRate) && publicRate >= 0 ? publicRate : 0;
  const computed = useMemo(() => {
    const map = {};
    pricing.states.forEach(s => {
      map[s.name] = computeState(s, gasV, evV, safeMiles, publicShare, effPublicRate);
    });
    return map;
  }, [gasV, evV, safeMiles, publicShare, effPublicRate, pricing]);

  const rows = Object.values(computed);
  const maxPos = Math.max(0, ...rows.map(r => r.savings));
  const maxNeg = Math.max(0, ...rows.map(r => -r.savings));

  // summary stats
  const avg = rows.reduce((a, r) => a + r.savings, 0) / rows.length;
  const winners = rows.filter(r => r.savings > 0).length;
  const top = rows.reduce((a, r) => (r.savings > a.savings ? r : a), rows[0]);

  const path = useMemo(() => d3.geoPath(), []);

  const hoverData = hover ? computed[hover.name] : null;

  function onMove(e){
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    setHover(h => h ? { ...h, x: e.clientX - rect.left, y: e.clientY - rect.top } : h);
  }

  return (
    <div className="wrap">
      {/* Header */}
      <div className="eyebrow"><span className="dot"></span>Fuel vs. electrons</div>
      <h1>See where an EV <span className="fade">pays you back</span></h1>
      <p className="lede">Pick a gas car and an electric one, set how far you drive, and
        watch the map light up with what you'd save on energy in every state.</p>

      {/* Controls */}
      <div className="controls">
       <div className="controls-grid">
        <div className="field">
          <label>{Icon.gas} Gas vehicle</label>
          <div className="select-wrap">
            <select className="control" value={gasId} onChange={e => setGasId(e.target.value)}>
              {groupByMake(GAS_VEHICLES).map(g =>
                <optgroup key={g.make} label={g.make}>
                  {g.items.map(v =>
                    <option key={v.id} value={v.id}>{modelName(v)} — {v.mpg} mpg</option>)}
                </optgroup>)}
            </select>
            <span className="chev">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </div>
        </div>

        <div className="field">
          <label>{Icon.bolt} Electric vehicle</label>
          <div className="select-wrap">
            <select className="control" value={evId} onChange={e => setEvId(e.target.value)}>
              {groupByMake(EV_VEHICLES).map(g =>
                <optgroup key={g.make} label={g.make}>
                  {g.items.map(v =>
                    <option key={v.id} value={v.id}>{modelName(v)} — {v.kwhPer100mi} kWh/100mi</option>)}
                </optgroup>)}
            </select>
            <span className="chev">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </div>
        </div>

        <div className="field">
          <label>{Icon.road} Miles / year</label>
          <input className="control" type="number" min="0" step="500" value={miles}
                 onChange={e => setMiles(e.target.value === "" ? "" : Number(e.target.value))} />
        </div>
       </div>

       {/* Public charging */}
       <div className="charging-row">
         <label className="switch">
           <input type="checkbox" checked={publicOn}
                  onChange={e => setPublicOn(e.target.checked)} />
           <span className="track"><span className="thumb"></span></span>
           <span className="switch-label">{Icon.plug} Include public charging</span>
         </label>

         <div className={"pub-controls" + (publicOn ? "" : " off")}>
           <div className="pub-group">
             <span className="pub-cap">Share of miles on public chargers</span>
             <input type="range" className="slider" min="0" max="100" step="5"
                    value={publicPct} disabled={!publicOn}
                    onChange={e => setPublicPct(Number(e.target.value))} />
             <span className="pub-val">{publicPct}%</span>
           </div>
           <div className="pub-group">
             <span className="pub-cap">Public rate</span>
             <span className="rate-input">
               <span className="sym">$</span>
               <input type="number" min="0" step="0.01" value={publicRate} disabled={!publicOn}
                      onChange={e => setPublicRate(e.target.value === "" ? "" : Number(e.target.value))} />
               <span className="unit">/kWh</span>
             </span>
             <span className="pub-note">varies — typically {PUBLIC_RATE_RANGE}/kWh</span>
           </div>
         </div>
       </div>
      </div>

      {/* Map */}
      <div className="map-card" ref={wrapRef}>
        {!features && !loadError &&
          <div className="map-status"><span className="spin"></span> Loading map…</div>}
        {loadError &&
          <div className="map-status">
            Couldn't load the map geometry — check the network connection and reload.
          </div>}

        {features &&
          <svg className={"usmap" + (hover ? " dim" : "")} viewBox="0 0 975 610"
               onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
            {features.map(f => {
              const c = computed[f.properties.name];
              const fill = c ? colorFor(c.savings, maxPos, maxNeg) : "#1b2740";
              const isHl = c && hover && hover.name === f.properties.name;
              return (
                <path key={f.id}
                  className={"state" + (isHl ? " hl" : "")}
                  d={path(f)} fill={fill}
                  onMouseEnter={() => c && setHover({ name:f.properties.name, x:0, y:0 })}
                />
              );
            })}
          </svg>}

        {/* Legend */}
        {features &&
          <div className="legend">
            <span className="cap">EV costs more</span>
            <div className="bar"></div>
            <span className="cap more">More savings</span>
          </div>}

        {/* Tooltip */}
        {hoverData &&
          <div className="tooltip show" style={{
              left: Math.min(hover.x + 18, (wrapRef.current?.clientWidth || 999) - 250),
              top:  Math.max(hover.y - 10, 8) }}>
            <div className="tt-name">{hoverData.name}</div>
            <div className={"tt-sav " + (hoverData.savings >= 0 ? "pos" : "neg")}>
              {hoverData.savings >= 0 ? "+" : "−"}{fmtMoney0(Math.abs(hoverData.savings))}
              <small>{hoverData.savings >= 0 ? "saved per year with the EV" : "more per year with the EV"}</small>
            </div>
            <div className="tt-row"><span>Gas price</span><span>{fmtMoney2(hoverData.gas)}/gal</span></div>
            <div className="tt-row">
              <span>{hoverData.publicShare > 0 ? "Electricity (blended)" : "Electricity"}</span>
              <span>{fmtMoney2(hoverData.effElec)}/kWh</span>
            </div>
            <div className="tt-split">
              <div className="tt-chip gas">
                <div className="lab">Gas / 100mi</div>
                <div className="val">{fmtMoney2(hoverData.gasPer100)}</div>
              </div>
              <div className="tt-chip ev">
                <div className="lab">EV / 100mi</div>
                <div className="val">{fmtMoney2(hoverData.evPer100)}</div>
              </div>
            </div>
          </div>}
      </div>

      {/* Summary cards */}
      <div className="cards">
        <SummaryMoney label="Average savings / yr" icon={Icon.trend}
          value={avg} sub="across all 50 states + DC" />
        <SummaryCount label="States where EV wins" icon={Icon.pin}
          value={winners} total={rows.length} sub="cheaper to charge than fuel" />
        <SummaryTop label="Biggest winner" icon={Icon.flag}
          value={top.savings} name={top.name} />
      </div>

      {/* Footnote */}
      <div className="foot">
        <span className={"data-badge" + (pricing.live ? " live" : "")}>
          {pricing.live
            ? (pricing.updated ? `Live data · updated ${pricing.updated}` : "Live data")
            : "Sample data"}
        </span>
        {Icon.bolt}
        <span>Home charging uses each state's average residential electricity rate; public
          charging uses the rate you set above ({fmtMoney2(effPublicRate)}/kWh). Figures are
          illustrative sample data for the prototype — connect a live source to refresh gas &
          electricity prices automatically.</span>
      </div>
    </div>
  );
}

/* ---- summary card variants (animated) ---- */
function SummaryMoney({ label, icon, value, sub }){
  const v = useAnimatedNumber(value);
  return (
    <div className="card">
      <div className="clab">{icon}{label}</div>
      <div className="big">{fmtMoney0(v)}</div>
      <div className="sub">{sub}</div>
    </div>
  );
}
function SummaryCount({ label, icon, value, total, sub }){
  const v = useAnimatedNumber(value);
  return (
    <div className="card">
      <div className="clab">{icon}{label}</div>
      <div className="big">{Math.round(v)} <span className="slash">/ {total}</span></div>
      <div className="sub">{sub}</div>
    </div>
  );
}
function SummaryTop({ label, icon, value, name }){
  const v = useAnimatedNumber(value);
  return (
    <div className="card">
      <div className="clab">{icon}{label}</div>
      <div className="big">{fmtMoney0(v)}</div>
      <div className="sub">{name}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
